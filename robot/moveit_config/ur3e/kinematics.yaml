ur_manipulator:
  # LMA follows the supplied previous-waypoint seed deterministically.  KDL's
  # search fallback repeatedly selected a different UR elbow/wrist branch on
  # this dense Cartesian path even though every individual pose was solvable.
  kinematics_solver: lma_kinematics_plugin/LMAKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.2
  kinematics_solver_attempts: 1
